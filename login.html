<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Jing Workspace</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#e8eee4,#f8f6fc);color:#24322b}.card{width:min(100%,420px);background:#fff;padding:40px;border:1px solid #e3e7e0;border-radius:24px;box-shadow:0 18px 64px #31483514}.brand{color:#5b715b;letter-spacing:.15em;font-size:12px}h1{font-size:28px;margin:12px 0}p{font-size:14px;line-height:1.6;color:#727b74}label{display:block;font-size:14px;margin:26px 0 8px}input{width:100%;padding:14px;border:1px solid #cbd5c9;border-radius:10px;font-size:16px}input:focus{outline:2px solid #8eac90;outline-offset:2px}button{width:100%;padding:14px;margin-top:18px;background:#536951;color:#fff;border:0;border-radius:10px;font-size:16px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#error{color:#b34949;min-height:22px}.small{font-size:12px}</style><script src="/login.js" defer></script></head>
<body><main class="card"><div class="brand">THINK · LEARN · WORK · GROW</div><h1>Jing Workspace</h1><p>你的私人学习与研究工作台。<br>请输入密码以进入。</p><form id="loginForm"><label for="password">工作台密码</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus><button id="submit" type="submit">进入工作台</button><p id="error" role="alert" aria-live="polite"></p></form><p class="small">密码由服务器验证。API Key 不会保存到此网页。</p></main></body></html>
